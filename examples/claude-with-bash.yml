name: Claude PR Assistant with Bash
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude-code-action:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude PR Action with Bash enabled
        uses: Akira-Papa/claude-code-action@beta
        with:
          # Option 1: Use Anthropic API key
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Option 2: Use OAuth for Claude Max subscribers
          # use_oauth: "true"
          # claude_access_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          # claude_refresh_token: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          # claude_expires_at: ${{ secrets.CLAUDE_EXPIRES_AT }}

          # Enable specific bash commands
          # Format: "Bash(command1),Bash(command2),..."
          allowed_tools: "Bash(ls),Bash(pwd),Bash(git status),Bash(npm install),Bash(npm test),Bash(npm run build)"

          # Or if you want to allow ALL bash commands (less secure):
          # allowed_tools: "Bash"

          timeout_minutes: "60"
