name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: jr413/claude-code-action@main
        with:
          use_oauth: "true"
          claude_access_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          claude_refresh_token: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          claude_expires_at: ${{ secrets.CLAUDE_EXPIRES_AT }}
          claude_client_id: ${{ secrets.CLAUDE_CLIENT_ID }}
          claude_client_secret: ${{ secrets.CLAUDE_CLIENT_SECRET }}
          
          # Enable Bash commands
          allowed_tools: "Bash(ls),Bash(pwd),Bash(git status),Bash(git diff),Bash(npm install),Bash(npm test),Bash(npm run build),Bash(yarn),Bash(yarn test),Bash(yarn build),Bash(bun),Bash(bun test),Bash(bun run)"
          
          timeout_minutes: "60"
