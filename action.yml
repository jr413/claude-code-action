name: "Claude Max Code Action (OAuth Fork)"
description: "Fork of Claude Code Action that supports OAuth authentication for Claude Max subscribers. General-purpose Claude agent for GitHub PRs and issues. Can answer questions and implement code changes."
branding:
  icon: "at-sign"
  color: "orange"

inputs:
  trigger_phrase:
    description: "The trigger phrase to look for in comments or issue body"
    required: false
    default: "@claude"
  assignee_trigger:
    description: "The assignee username that triggers the action (e.g. @claude)"
    required: false

  # Claude Code configuration
  model:
    description: "Model to use (provider-specific format required for Bedrock/Vertex)"
    required: false
  anthropic_model:
    description: "DEPRECATED: Use 'model' instead. Model to use (provider-specific format required for Bedrock/Vertex)"
    required: false
  allowed_tools:
    description: "Additional tools for Claude to use (the base GitHub tools will always be included)"
    required: false
    default: ""
  disallowed_tools:
    description: "Tools that Claude should never use"
    required: false
    default: ""
  custom_instructions:
    description: "Additional custom instructions to include in the prompt for Claude"
    required: false
    default: ""
  direct_prompt:
    description: "Direct instruction for Claude (bypasses normal trigger detection)"
    required: false
    default: ""

  # Auth configuration
  anthropic_api_key:
    description: "Anthropic API key (required for direct API, not needed for Bedrock/Vertex/OAuth)"
    required: false
  github_token:
    description: "GitHub token with repo and pull request permissions (optional if using GitHub App)"
    required: false
  use_bedrock:
    description: "Use Amazon Bedrock with OIDC authentication instead of direct Anthropic API"
    required: false
    default: "false"
  use_vertex:
    description: "Use Google Vertex AI with OIDC authentication instead of direct Anthropic API"
    required: false
    default: "false"
  use_oauth:
    description: "Use Claude AI OAuth authentication instead of API key (for Claude Max subscribers)"
    required: false
    default: "false"
  claude_access_token:
    description: "Claude AI OAuth access token (required when use_oauth is true)"
    required: false
    default: ""
  claude_refresh_token:
    description: "Claude AI OAuth refresh token (optional for token refresh)"
    required: false
    default: ""
  claude_expires_at:
    description: "Claude AI OAuth token expiration timestamp"
    required: false
    default: ""
  claude_client_id:
    description: "Claude AI OAuth client ID (required when use_oauth is true)"
    required: false
    default: ""
  claude_client_secret:
    description: "Claude AI OAuth client secret (required when use_oauth is true)"
    required: false
    default: ""

  timeout_minutes:
    description: "Timeout in minutes for execution"
    required: false
    default: "30"

outputs:
  execution_file:
    description: "Path to the Claude Code execution output file"
    value: ${{ steps.claude-code.outputs.execution_file }}

runs:
  using: "composite"
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.11

    - name: Install Dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        bun install

    - name: Refresh OAuth Tokens
      id: oauth-refresh
      if: inputs.use_oauth == 'true'
      shell: bash
      run: |
        bun run ${{ github.action_path }}/src/entrypoints/oauth-refresh.ts
      env:
        USE_OAUTH: ${{ inputs.use_oauth }}
        CLAUDE_ACCESS_TOKEN: ${{ inputs.claude_access_token }}
        CLAUDE_REFRESH_TOKEN: ${{ inputs.claude_refresh_token }}
        CLAUDE_EXPIRES_AT: ${{ inputs.claude_expires_at }}
        CLAUDE_CLIENT_ID: ${{ inputs.claude_client_id }}
        CLAUDE_CLIENT_SECRET: ${{ inputs.claude_client_secret }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        GITHUB_OUTPUT: ${{ env.GITHUB_OUTPUT }}
        GITHUB_ENV: ${{ env.GITHUB_ENV }}

    - name: Prepare action
      id: prepare
      shell: bash
      run: |
        bun run ${{ github.action_path }}/src/entrypoints/prepare.ts
      env:
        TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
        DIRECT_PROMPT: ${{ inputs.direct_prompt }}
        OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_RUN_ID: ${{ github.run_id }}

    - name: Setup Claude Code
      if: steps.prepare.outputs.contains_trigger == 'true'
      shell: bash
      run: |
        # Install Claude Code CLI
        npm install -g @anthropic-ai/claude-code@latest

        # Create credentials file for OAuth
        if [ "${{ inputs.use_oauth }}" == "true" ]; then
          mkdir -p ~/.claude
          cat > ~/.claude/.credentials.json << EOF
        {
          "claudeAiOauth": {
            "accessToken": "${{ inputs.claude_access_token }}",
            "refreshToken": "${{ inputs.claude_refresh_token }}",
            "expiresAt": ${{ inputs.claude_expires_at }},
            "scopes": ["user:inference", "user:profile"],
            "subscriptionType": "max"
          }
        }
        EOF
        fi

    - name: Run Claude Code
      id: claude-code
      if: steps.prepare.outputs.contains_trigger == 'true'
      shell: bash
      run: |
        # Install Claude Code CLI
        echo "Claude Code CLI をインストール中..."
        npm install -g @anthropic-ai/claude-code@latest
        export PATH="$HOME/.local/bin:$PATH"
        
        # Set up environment
        export PROMPT_FILE="/tmp/claude-prompts/claude-prompt.txt"
        export OUTPUT_FILE="/tmp/claude-code-output.json"
        
        # Set model
        export ANTHROPIC_MODEL="${{ inputs.model || inputs.anthropic_model || 'claude-3-5-sonnet-20250114' }}"
        
        # Set OAuth credentials
        export CLAUDE_ACCESS_TOKEN="${{ env.CLAUDE_ACCESS_TOKEN || inputs.claude_access_token }}"
        export CLAUDE_REFRESH_TOKEN="${{ env.CLAUDE_REFRESH_TOKEN || inputs.claude_refresh_token }}"
        export CLAUDE_EXPIRES_AT="${{ env.CLAUDE_EXPIRES_AT || inputs.claude_expires_at }}"
        export CLAUDE_CLIENT_ID="${{ inputs.claude_client_id }}"
        export CLAUDE_CLIENT_SECRET="${{ inputs.claude_client_secret }}"
        
        # Build Claude Code command
        CLAUDE_CMD="claude"
        
        # Add model flag
        if [ -n "$ANTHROPIC_MODEL" ]; then
          CLAUDE_CMD="$CLAUDE_CMD --model $ANTHROPIC_MODEL"
        fi
        
        # Add OAuth provider
        if [ "${{ inputs.use_oauth }}" == "true" ]; then
          CLAUDE_CMD="$CLAUDE_CMD --provider oauth"
        fi
        
        # Add timeout
        CLAUDE_CMD="$CLAUDE_CMD --timeout ${{ inputs.timeout_minutes || 30 }}m"
        
        # Run Claude Code with the prompt file
        echo "Claude Code コマンド実行: $CLAUDE_CMD"
        $CLAUDE_CMD < "$PROMPT_FILE" > "$OUTPUT_FILE" 2>&1
        CLAUDE_EXIT_CODE=$?
        
        # Set outputs
        echo "execution_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT
        if [ $CLAUDE_EXIT_CODE -eq 0 ]; then
          echo "conclusion=success" >> $GITHUB_OUTPUT
        else
          echo "conclusion=failure" >> $GITHUB_OUTPUT
        fi
        
        exit $CLAUDE_EXIT_CODE
      env:
        # Model configuration
        ANTHROPIC_MODEL: ${{ inputs.model || inputs.anthropic_model || 'claude-3-5-sonnet-20250114' }}
        GITHUB_TOKEN: ${{ steps.prepare.outputs.GITHUB_TOKEN }}
        
        # OAuth configuration
        CLAUDE_ACCESS_TOKEN: ${{ env.CLAUDE_ACCESS_TOKEN || inputs.claude_access_token }}
        CLAUDE_REFRESH_TOKEN: ${{ env.CLAUDE_REFRESH_TOKEN || inputs.claude_refresh_token }}
        CLAUDE_EXPIRES_AT: ${{ env.CLAUDE_EXPIRES_AT || inputs.claude_expires_at }}

        # AWS configuration
        AWS_REGION: ${{ env.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
        ANTHROPIC_BEDROCK_BASE_URL: ${{ env.ANTHROPIC_BEDROCK_BASE_URL }}

        # GCP configuration
        ANTHROPIC_VERTEX_PROJECT_ID: ${{ env.ANTHROPIC_VERTEX_PROJECT_ID }}
        CLOUD_ML_REGION: ${{ env.CLOUD_ML_REGION }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        ANTHROPIC_VERTEX_BASE_URL: ${{ env.ANTHROPIC_VERTEX_BASE_URL }}

        # Model-specific regions for Vertex
        VERTEX_REGION_CLAUDE_3_5_HAIKU: ${{ env.VERTEX_REGION_CLAUDE_3_5_HAIKU }}
        VERTEX_REGION_CLAUDE_3_5_SONNET: ${{ env.VERTEX_REGION_CLAUDE_3_5_SONNET }}
        VERTEX_REGION_CLAUDE_3_7_SONNET: ${{ env.VERTEX_REGION_CLAUDE_3_7_SONNET }}

    - name: Update comment with job link
      if: steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.claude_comment_id && always()
      shell: bash
      run: |
        echo "=== Update comment ステップ (スキップ) ==="
        echo "コメント更新処理は一時的にスキップします"
        echo "✅ Update comment 完了"
      env:
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        CLAUDE_COMMENT_ID: ${{ steps.prepare.outputs.claude_comment_id }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_TOKEN: ${{ steps.prepare.outputs.GITHUB_TOKEN }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        CLAUDE_BRANCH: ${{ steps.prepare.outputs.CLAUDE_BRANCH }}
        IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment' }}
        DEFAULT_BRANCH: ${{ steps.prepare.outputs.DEFAULT_BRANCH }}
        CLAUDE_SUCCESS: ${{ steps.claude-code.outputs.conclusion == 'success' }}
        OUTPUT_FILE: ${{ steps.claude-code.outputs.execution_file || '' }}
        TRIGGER_USERNAME: ${{ github.event.comment.user.login || github.event.issue.user.login || github.event.pull_request.user.login || github.event.sender.login || github.triggering_actor || github.actor || '' }}

    - name: Display Claude Code Report
      if: steps.prepare.outputs.contains_trigger == 'true' && steps.claude-code.outputs.execution_file != ''
      shell: bash
      run: |
        echo "## Claude Code Report" >> $GITHUB_STEP_SUMMARY
        echo '```json' >> $GITHUB_STEP_SUMMARY
        cat "${{ steps.claude-code.outputs.execution_file }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Revoke app token
      if: always() && inputs.github_token == ''
      shell: bash
      run: |
        curl -L \
          -X DELETE \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ steps.prepare.outputs.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          ${GITHUB_API_URL:-https://api.github.com}/installation/token
