rules_to_remember:
  file_creation:
    - "新規ファイル作成前に必ず既存ファイルを確認"
    - "一時ファイルは作業後すぐに削除"
    - "ファイル作成の必要性を説明してから作成"

  dependencies:
    - "npm パッケージ追加前に必ずユーザーの許可を得る"
    - "既存ライブラリで実現可能か先に検討"
    - "依存関係は最小限に保つ"

  code_quality:
    - "既存コードの修正を優先、新規作成は最小限に"
    - "コメントは要求された場合のみ追加"
    - "既存のコーディング規約に従う"

  git_operations:
    - "CI 環境では git コマンドを使わない"
    - "GitHub API を優先的に使用"
    - "git 操作が必要な場合はモック化を検討"
    
  oauth_handling:
    - "OAuth トークンは頻繁に期限切れする"
    - "トークン検証を作業開始時に必ず実行"
    - "エラー時は詳細なログを出力"
    - "refresh token を使った自動更新を検討"
    - "OAuth 関連の変更は慎重に行う"

common_mistakes:
  - mistake: "許可なく新しい npm パッケージを追加"
    prevention: "package.json 変更前に必ず確認"
    
  - mistake: "不要なテストファイルを残す"
    prevention: "作業完了時に git status で確認"
    
  - mistake: "外部アクションに過度に依存"
    prevention: "直接実装できないか検討"
    
  - mistake: "Prettier エラーでCIが失敗"
    prevention: |
      - コミット前に必ず `bun run format:check` または `npx prettier --check .` を実行
      - エラーが出たら `bun run format` または `npx prettier --write .` で修正
      - 問題のあるファイルは .prettierignore に追加を検討
      
  - mistake: "OAuth 認証エラーで GitHub Actions が失敗"
    prevention: |
      - OAuth トークンの有効期限を事前に確認（~/.claude/.credentials.json の expiresAt）
      - アクセストークンが期限切れの場合は refresh token で更新
      - エラー時は認証情報の再設定を提案
      - OAuth 関連の変更は段階的にテスト

best_practices:
  - "段階的デバッグ：問題を一つずつ解決"
  - "環境検出を活用：process.env.CI, process.env.GITHUB_ACTIONS"
  - "エラーメッセージを正確に記録・分析"
  - "変更は最小限に、影響範囲を限定"
  - "解決した問題は詳細な手順と共に詰め集.yml に記録"
  - "再利用可能な解決方法を蓄積し、効率化を図る"

pre_push_checklist:
  - name: "Prettier チェック"
    command: "bun run format:check"
    fix: "bun run format"
    note: "必ずコミット前に実行。CIでの失敗を防ぐ"
    
  - name: "TypeScript 型チェック"
    command: "bun run typecheck"
    fix: "型エラーを修正"
    note: "未使用インポートや型エラーをチェック"
    
  - name: "テスト実行"
    command: "bun test"
    fix: "失敗したテストを修正"
    note: "CI環境を想定してテスト"
    
  - name: "不要ファイル確認"
    command: "git status"
    fix: "不要なファイルを削除または.gitignoreに追加"
    note: "テストファイル、一時ファイル、大容量ファイルに注意"
    
  - name: "OAuth トークン有効性確認"
    command: "cat ~/.claude/.credentials.json | jq .claudeAiOauth.expiresAt"
    fix: "期限切れの場合は refresh token で更新、または再認証"
    note: "OAuth エラーの主な原因。expiresAt が現在時刻より大きいか確認"

# 再利用可能な解決方法ライブラリ
solution_library:
  claude_code_version_update:
    problem: "Claude Code バージョンが古くて GitHub Actions が失敗"
    symptoms:
      - "It looks like your version of Claude Code (1.0.2) needs an update"
      - "A newer version (1.0.24 or higher) is required"
    solution_steps:
      1: "外部アクション依存を削除"
      2: "action.yml で直接インストール: npm install -g @anthropic-ai/claude-code@latest"
      3: "OAuth 認証情報を ~/.claude/.credentials.json で管理"
    commands:
      - "npm install -g @anthropic-ai/claude-code@latest"
    time_to_fix: "30分"
    prevention: "外部依存は最小限に、直接インストールを優先"

  git_exit_code_128:
    problem: "CI で git コマンドが exit code 128 で失敗"
    symptoms:
      - "The process '/usr/bin/git' failed with exit code 128"
      - "git fetch, git checkout でエラー"
    solution_steps:
      1: "git 操作を完全に無効化"
      2: "execSync, Bun $ を削除"
      3: "GitHub API のみを使用"
      4: "モック関数でログ出力のみ"
    commands:
      - "git config --global user.email 'test@example.com'"
      - "git config --global user.name 'Test User'"
    time_to_fix: "1時間"
    prevention: "CI 環境では git コマンドに依存しない設計"

  prettier_format_errors:
    problem: "Prettier フォーマットエラーで CI が失敗"
    symptoms:
      - "Code style issues found in X files"
      - "Process completed with exit code 1"
    solution_steps:
      1: "bun run format でフォーマット修正"
      2: "問題ファイルを .prettierignore に追加"
      3: "Git hooks で自動チェック設定"
    commands:
      - "bun run format:check"
      - "bun run format"
      - "bun run install-hooks"
    time_to_fix: "15分"
    prevention: "コミット前に必ず format:check を実行"

  oauth_authentication_errors:
    problem: "OAuth 認証エラーで GitHub Actions が失敗"
    symptoms:
      - "Authentication failed"
      - "Invalid access token"
      - "Token expired"
    solution_steps:
      1: "~/.claude/.credentials.json の expiresAt 確認"
      2: "期限切れなら refresh token で更新"
      3: "必要に応じて再認証"
    commands:
      - "cat ~/.claude/.credentials.json | jq .claudeAiOauth.expiresAt"
      - "date +%s # 現在のタイムスタンプと比較"
    time_to_fix: "10分"
    prevention: "作業開始時に OAuth トークン有効性を必ずチェック"